captive_portal:
  id: captive_portal_captiveportal_id
  web_server_base_id: web_server_base_webserverbase_id
  compression: gzip
time:
  - platform: homeassistant
    id: ha_time
    timezone: CET-1CEST,M3.5.0,M10.5.0/3
    update_interval: 15min
spi:
  - id: main_bus
    clk_pin:
      number: 18
      mode:
        output: true
        input: false
        open_drain: false
        pullup: false
        pulldown: false
      id: esp32_esp32internalgpiopin_id
      inverted: false
      ignore_pin_validation_error: false
      ignore_strapping_warning: false
      drive_strength: 20.0
    mosi_pin:
      number: 23
      mode:
        output: true
        input: false
        open_drain: false
        pullup: false
        pulldown: false
      id: esp32_esp32internalgpiopin_id_2
      inverted: false
      ignore_pin_validation_error: false
      ignore_strapping_warning: false
      drive_strength: 20.0
    miso_pin:
      number: 19
      mode:
        input: true
        output: false
        open_drain: false
        pullup: false
        pulldown: false
      id: esp32_esp32internalgpiopin_id_3
      inverted: false
      ignore_pin_validation_error: false
      ignore_strapping_warning: false
      drive_strength: 20.0
    interface: any
    type: single
    interface_index: 0
external_components:
  - source:
      path: D:\dev\compteur_eau\ESPHOME-release
      type: local
    components:
      - everblu_meter
    refresh: 1d
everblu_meter:
  - id: compteur_eau
    spi_id: main_bus
    meter_code:
      raw: 13-0685444-219
      year: 13
      serial: 685444
    meter_type: water
    cs_pin:
      number: 25
      mode:
        output: true
        input: false
        open_drain: false
        pullup: false
        pulldown: false
      id: esp32_esp32internalgpiopin_id_4
      inverted: false
      ignore_pin_validation_error: false
      ignore_strapping_warning: false
      drive_strength: 20.0
    gdo0_pin:
      number: 4
      mode:
        input: true
        output: false
        open_drain: false
        pullup: false
        pulldown: false
      id: esp32_esp32internalgpiopin_id_5
      inverted: false
      ignore_pin_validation_error: false
      ignore_strapping_warning: false
      drive_strength: 20.0
    gdo2_pin:
      number: 27
      mode:
        input: true
        output: false
        open_drain: false
        pullup: false
        pulldown: false
      id: esp32_esp32internalgpiopin_id_6
      inverted: false
      ignore_pin_validation_error: false
      ignore_strapping_warning: false
      drive_strength: 20.0
    time_id: ha_time
    timezone_offset: 60
    auto_align_time: true
    reading_schedule: Never
    read_hour: 4
    read_minute: 0
    initial_read_on_boot: false
    request_reading_button:
      name: Lire le compteur maintenant
      disabled_by_default: false
      id: everblu_meter_everblumetertriggerbutton_id
    deep_scan_button:
      name: Scan frequentiel profond
      disabled_by_default: false
      id: everblu_meter_everblumetertriggerbutton_id_2
      icon: mdi:radar
      entity_category: config
    reset_frequency_button:
